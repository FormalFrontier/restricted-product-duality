version: "v0.4"
project:
  name: Restricted-product duality
  description: >-
    Compact finite-exceptional-stage control under T1 on a cofinite restricted
    product or openness of its distinguished subsets, singleton principal-stage
    homeomorphisms with ordinary products, coordinatewise path-component comparison
    for singleton cofinite products without separation hypotheses, compact-map
    finite restriction, homotopy groups of T1 singleton cofinite restricted products,
    circle-valued pairings, conditional character reconstruction and symmetric
    Pontryagin duality, and contravariant naturality.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Beacon
  license: Apache-2.0
sources:
  - title: Cohomology of Number Fields (corrected second edition, version 2.3)
    authors:
      - Jürgen Neukirch
      - Alexander Schmidt
      - Kay Wingberg
    type: book
    location: Proposition (1.1.13), pp. 10–11
    relationship: background
    note: >-
      Motivation for the finite-coordinate conditional specialization only;
      the general locally compact-coordinate proposition is not established here.
    author_endorsement: not-contacted
  - title: A Concise Course in Algebraic Topology
    authors:
      - J. P. May
    type: book
    relationship: background
    note: >-
      Motivation for the ordinary finite-support-product viewpoint; no comparison
      with compactly generated products or CW weak products is claimed. The
      homotopy comparison concerns only the ordinary singleton cofinite restricted
      product with its T1 hypothesis. The path-component comparison uses ordinary
      products and the quotient by paths, not connected components.
    author_endorsement: not-contacted
  - title: mathlib4
    type: software
    id: https://github.com/leanprover-community/mathlib4/tree/e37d88a26f3791ed5a93daa1f949af1021b8d103
    relationship: background
    license: Apache-2.0
    note: >-
      Imported dependency for restricted products, path-component quotients, paths,
      homotopy groups, relative homotopies, Pontryagin duals and finite characters.
      The restricted-product carrier, topology and principal inclusions are from the
      formalization by Anatole Dedecker; homotopy groups are from Roberto Alvarez's
      formalization.
automation:
  methods:
    - method: agent
      framework: Codex CLI with Hive Tasks
      tool_setup: >-
        AI agents drafted and checked Lean implementations, examples and
        documentation with pinned Lean/mathlib builds and separate agent review.
  notes: >-
    AI agents developed the foundations, character reconstruction, symmetric
    duality, naturality and client examples with separate agent review.
review:
  status: mathematical content reviewed
  notes: >-
    The conditional statements for cofinite restricted products require their
    stated hypotheses. The general locally compact-coordinate proposition,
    source coverage, source-author endorsement and independent rights clearance
    are not claimed.
