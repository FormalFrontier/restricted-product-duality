version: "v0.4"
project:
  name: Restricted-product duality
  description: >-
    Finite-exceptional-stage control, circle-valued pairings, conditional
    character reconstruction and symmetric Pontryagin duality, and contravariant
    naturality for cofinite restricted products.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Beacon
  license: Apache-2.0
sources:
  - title: Cohomology of Number Fields (corrected second edition, version 2.3)
    authors:
      - Jürgen Neukirch
      - Alexander Schmidt
      - Kay Wingberg
    type: book
    location: Proposition (1.1.13), pp. 10–11
    relationship: adapts
    note: >-
      Motivation for the finite-coordinate conditional specialization only;
      the general locally compact-coordinate proposition is not established here.
    author_endorsement: not-contacted
  - title: Finite-coordinate restricted-product Pontryagin duality
    authors:
      - Formal Frontier Agents
    type: original-proof
    id: "FormalFrontier/source-nsw@6aa9219432580134ac086953d1fe98599c88d6e0:expositions/finite-restricted-product-pontryagin-duality.md"
    relationship: background
    note: >-
      Independently reviewed mathematical exposition informing this implementation;
      neither its review nor this entry asserts checked source correspondence.
  - title: mathlib4
    type: software
    id: https://github.com/leanprover-community/mathlib4/tree/e37d88a26f3791ed5a93daa1f949af1021b8d103
    relationship: background
    license: Apache-2.0
    note: Imported dependency for restricted products, Pontryagin duals and finite characters.
automation:
